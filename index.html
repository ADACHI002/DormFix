<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DormFix - แจ้งซ่อม</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:25px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:27px}
header p{margin:0}
.container{max-width:900px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #1e293b12}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:110px;resize:vertical}
.btn{width:100%;border:0;border-radius:10px;padding:13px 18px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.99)}
.notice{padding:12px;border-radius:10px;background:#eef4ff;color:#234}
.item{padding:14px 0;border-bottom:1px solid #e7ebf1}
.item:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}
.wait{background:#fee2e2;color:#b91c1c}
.doing{background:#fef3c7;color:#92400e}
.done{background:#dcfce7;color:#166534}
.small{font-size:12px;color:#64748b}
.empty{text-align:center;color:#718096;padding:20px}
#msg{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#dcfce7;color:#166534}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<h1>🛠️ แจ้งซ่อมสิ่งต่างๆในหอพัก</h1>
<p>โรงเรียนวิทยาศาสตร์จุฬาภรณราชวิทยาลัย</p>
</header>

<div class="container">
<div class="card">
<h2>📝 แบบฟอร์มแจ้งซ่อม</h2>
<div class="notice">กรอกข้อมูลให้ครบ แล้วกด “ส่งแจ้งซ่อม” รายการจะถูกบันทึกไว้ให้ผู้ดูแลหอพักตรวจสอบ</div>
<form id="repairForm" style="margin-top:16px">
<div class="grid">
<div>
<label for="name">ชื่อผู้แจ้ง</label>
<input id="name" required placeholder="เช่น ณัฐวัศห์">
</div>
<div>
<label for="dorm">หอพัก</label>
<select id="dorm" required>
<option value="">-- เลือกหอพัก --</option>
<option>หอพักสกลนคร</option>
<option>หอพักบึงกาฬ</option>
<option>หอพักอุดรธานี</option>
<option>หอพักหนองคาย</option>
<option>หอพักขอนแก่น</option>
</select>
</div>
<div>
<label for="zone">โซนที่พัก</label>
<input id="zone" required placeholder="เช่น โซน A">
</div>
<div>
<label for="room">ห้อง</label>
<input id="room" required placeholder="เช่น 1">
</div>
<div>
<label for="type">ประเภทปัญหา</label>
<select id="type" required>
<option value="">-- เลือกประเภท --</option>
<option>💡 ไฟฟ้า</option>
<option>🌀 พัดลม</option>
<option>🚿 น้ำประปา</option>
<option>🚪 ประตู/หน้าต่าง</option>
<option>🔧 อื่น ๆ</option>
</select>
</div>
<div class="full">
<label for="detail">รายละเอียดปัญหา</label>
<textarea id="detail" required placeholder="อธิบายอาการหรือสิ่งที่ชำรุด..."></textarea>
</div>
<div class="full">
<label for="photo">📷 รูปภาพปัญหา (ถ้ามี)</label>
<input id="photo" type="file" accept="image/*">
</div>
</div>
<button class="btn" type="submit">📨 ส่งแจ้งซ่อม</button>
<div id="msg"></div>
</form>
</div>

<div class="card">
<h2>🔎 รายการแจ้งซ่อมของเครื่องนี้</h2>
<div id="studentList"></div>
</div>
</div>

<script>
const STORAGE_KEY = "dormfix_repairs";
let repairs = [];

function loadRepairs(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    repairs = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(repairs)) repairs = [];
  } catch(e) {
    repairs = [];
  }
}

function saveRepairs(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(repairs));
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function badge(status){
  const cls = status === "รอรับเรื่อง" ? "wait" :
              status === "กำลังซ่อม" ? "doing" : "done";
  return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
}

function render(){
  const box = document.getElementById("studentList");
  if(!repairs.length){
    box.innerHTML = '<div class="empty">ยังไม่มีรายการแจ้งซ่อม</div>';
    return;
  }
  box.innerHTML = repairs.map(x => `
    <div class="item">
      <b>${escapeHTML(x.type)} — ${escapeHTML(x.dorm)} | โซน ${escapeHTML(x.zone)} | ห้อง ${escapeHTML(x.room)}</b>
      ${badge(x.status)}
      <div style="margin-top:6px">${escapeHTML(x.detail)}</div>
      ${x.photo ? `<div style="margin-top:8px"><img src="${x.photo}" style="max-width:220px;max-height:160px;border-radius:10px;border:1px solid #ddd" alt="รูปปัญหา"></div>` : ""}
      <div class="small" style="margin-top:6px">ผู้แจ้ง: ${escapeHTML(x.name)} | ${escapeHTML(x.date)}</div>
    </div>
  `).join("");
}

document.getElementById("repairForm").addEventListener("submit", function(e){
  e.preventDefault();

  const form = this;
  const photoFile = document.getElementById("photo").files[0];

  const createItem = (photoData) => {
    const item = {
      id: Date.now(),
      name: document.getElementById("name").value.trim(),
      dorm: document.getElementById("dorm").value,
      zone: document.getElementById("zone").value.trim(),
      room: document.getElementById("room").value.trim(),
      type: document.getElementById("type").value,
      detail: document.getElementById("detail").value.trim(),
      photo: photoData || "",
      date: new Date().toLocaleString("th-TH"),
      status: "รอรับเรื่อง"
    };

    repairs.unshift(item);

    try {
      saveRepairs();
      form.reset();
      render();
      const msg = document.getElementById("msg");
      msg.textContent = "ส่งรายการแจ้งซ่อมเรียบร้อยแล้ว ✅";
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 4000);
    } catch(err) {
      repairs.shift();
      alert("บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    }
  };

  if(photoFile){
    if(photoFile.size > 2 * 1024 * 1024){
      alert("รูปภาพใหญ่เกิน 2 MB กรุณาเลือกรูปที่เล็กกว่านี้");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => createItem(reader.result);
    reader.onerror = () => alert("อ่านรูปภาพไม่สำเร็จ กรุณาลองใหม่");
    reader.readAsDataURL(photoFile);
  } else {
    createItem("");
  }
});

loadRepairs();
render();
</script>
</body>
</html>
