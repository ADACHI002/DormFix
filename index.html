<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DormFix - แจ้งซ่อม</title>
<style>body{font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f7fb;margin:0}.box{max-width:650px;margin:25px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 5px 25px #0001}label{display:block;font-weight:bold;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}textarea{min-height:100px}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:#1769e0;color:white;font-weight:bold;font-size:16px}button:disabled{opacity:.6}.ok{display:none;margin-top:12px;padding:10px;background:#e9f9ef;color:#087443;border-radius:8px}.err{display:none;margin-top:12px;padding:10px;background:#fff0f0;color:#b42318;border-radius:8px}</style></head>
<body><div class="box"><h1>🛠️ แจ้งซ่อมสิ่งต่างๆในหอพัก</h1><p>โรงเรียนวิทยาศาสตร์จุฬาภรณราชวิทยาลัย</p>
<form id="f"><label>ชื่อผู้แจ้ง</label><input id="name" required><label>หอพัก</label><select id="dorm" required><option value="">-- เลือก --</option><option>หอพักสกลนคร</option><option>หอพักบึงกาฬ</option><option>หอพักอุดรธานี</option><option>หอพักหนองคาย</option><option>หอพักขอนแก่น</option></select>
<label>โซน/ชั้น</label><input id="zone" required><label>ห้อง</label><input id="room" required placeholder="เช่น 1"><label>ประเภท</label><select id="type" required><option value="">-- เลือก --</option><option>ไฟฟ้า</option><option>ประปา</option><option>ห้องน้ำ</option><option>ประตู/หน้าต่าง</option><option>เตียง/โต๊ะ</option><option>อินเทอร์เน็ต</option><option>อื่นๆ</option></select>
<label>รายละเอียด</label><textarea id="detail" required></textarea><label>รูปภาพประกอบ (ถ้ามี)</label><input id="photo" type="file" accept="image/*"><small style="display:block;color:#667085;margin-top:5px">ระบบจะย่อรูปให้อัตโนมัติเพื่อเก็บใน Firestore โดยไม่ใช้ Firebase Storage</small><button id="btn" type="submit">ส่งแจ้งซ่อม</button></form><div id="ok" class="ok"></div><div id="err" class="err"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCjW7zpUqWAY9oQyTnydS3P19g-KOvt-Ic",
  authDomain: "dormfix-24fe0.firebaseapp.com",
  projectId: "dormfix-24fe0",
  storageBucket: "dormfix-24fe0.firebasestorage.app",
  messagingSenderId: "1048588260040",
  appId: "1:1048588260040:web:cf5dddf21c1cd81bfecbfd",
  measurementId: "G-XCMMLSN04V"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); const f=document.getElementById("f");
const errEl=document.getElementById("err"),okEl=document.getElementById("ok"),btn=document.getElementById("btn");
try{await signInAnonymously(auth)}catch(e){errEl.style.display="block";errEl.textContent="เชื่อมต่อไม่ได้: กรุณาเปิด Anonymous Authentication ใน Firebase"}
function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function compressImage(file){
 const MAX_BYTES=500*1024, MAX_SIDE=1280; const data=await readImage(file); const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("รูปภาพนี้ไม่สามารถอ่านได้ในเบราว์เซอร์"));img.src=data});
 let scale=Math.min(1,MAX_SIDE/Math.max(img.width,img.height)); let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
 const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
 for(let q=.82;q>=.35;q-=.07){const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob.size<=MAX_BYTES)return await readImage(blob)}
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.25)); if(blob.size>MAX_BYTES)throw new Error("รูปมีขนาดใหญ่เกินไป แม้หลังย่อแล้ว กรุณาเลือกรูปอื่น"); return await readImage(blob);
}
f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent="กำลังส่ง...";errEl.style.display="none";okEl.style.display="none";
try{if(!auth.currentUser)await signInAnonymously(auth);const photoEl=document.getElementById("photo");let photoData="";if(photoEl.files[0])photoData=await compressImage(photoEl.files[0]);
const data={name:document.getElementById("name").value.trim(),dorm:document.getElementById("dorm").value,zone:document.getElementById("zone").value.trim(),room:document.getElementById("room").value.trim(),type:document.getElementById("type").value,detail:document.getElementById("detail").value.trim(),status:"รอดำเนินการ",createdAt:serverTimestamp(),createdBy:auth.currentUser.uid};
if(photoData)data.photoData=photoData;const r=await addDoc(collection(db,"repairs"),data);f.reset();okEl.style.display="block";okEl.textContent="ส่งสำเร็จ เลขที่รายการ: "+r.id;window.scrollTo({top:0,behavior:"smooth"})
}catch(e){errEl.style.display="block";errEl.textContent="ส่งไม่สำเร็จ: "+(e?.message||e)}finally{btn.disabled=false;btn.textContent="ส่งแจ้งซ่อม"}};
</script></body></html>
