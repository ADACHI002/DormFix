<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DormFix - ผู้ดูแลหอพัก</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;padding:24px;text-align:center}
header h1{margin:0 0 6px;font-size:30px}header p{margin:0;opacity:.9}
.container{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:white;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #1e293b12}
h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:9px;font-size:15px}
textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}
.btn{border:0;border-radius:10px;padding:12px 18px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:14px;background:#f8fafc;text-align:center}.stat b{font-size:27px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:12px 9px;border-bottom:1px solid #e7ebf1;text-align:left;vertical-align:top}th{background:#f8fafc}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}.wait{background:#fee2e2;color:#b91c1c}.doing{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}
.empty{text-align:center;color:#718096;padding:30px}.danger{background:#dc2626}.small{font-size:12px;color:#64748b}
.qr-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.qr-box{padding:12px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;text-align:center}.qr-box img{width:220px;height:220px;display:block;margin:auto}.copy-box{flex:1;min-width:240px}
@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px;display:block;overflow:auto}}
</style></head><body>
<header><h1>🛠️ DormFix</h1><p>ระบบผู้ดูแลแจ้งซ่อมสิ่งต่างๆในหอพัก โรงเรียนวิทยาศาสตร์จุฬาภรณราชวิทยาลัย</p></header>
<div class="container">
<div class="card"><h2>📊 Dashboard</h2><div class="stats"><div class="stat">ทั้งหมด<b id="allCount">0</b></div><div class="stat">รอรับเรื่อง<b id="waitCount">0</b></div><div class="stat">กำลังซ่อม<b id="doingCount">0</b></div><div class="stat">ซ่อมเสร็จ<b id="doneCount">0</b></div></div></div>
<div class="card"><h2>🧰 รายการแจ้งซ่อม</h2><div id="adminList"></div></div>
<div class="card"><h2>📱 QR Code แจ้งซ่อม</h2><div class="qr-wrap"><div class="qr-box"><img id="qrImage" alt="QR Code แจ้งซ่อม"><div class="small">สแกนเพื่อเปิดเว็บแจ้งซ่อม</div></div><div class="copy-box"><label>ลิงก์เว็บแจ้งซ่อม</label><input id="qrUrl" readonly><button class="btn" type="button" style="margin-top:8px" onclick="copyQrUrl()">📋 คัดลอกลิงก์</button><p class="small">ต้องนำไฟล์ทั้ง 2 ไฟล์ขึ้นเว็บ/โฮสต์เดียวกัน</p></div></div></div>
</div><script>
let repairs=JSON.parse(localStorage.getItem("dormfix_repairs")||"[]");
function save(){localStorage.setItem("dormfix_repairs",JSON.stringify(repairs));render();}
function badge(s){let c=s==="รอรับเรื่อง"?"wait":s==="กำลังซ่อม"?"doing":"done";return `<span class="badge ${c}">${s}</span>`;}
function changeStatus(id,s){let x=repairs.find(a=>a.id===id);if(x){x.status=s;save();}}
function removeItem(id){if(confirm("ต้องการลบรายการนี้หรือไม่?")){repairs=repairs.filter(x=>x.id!==id);save();}}
function render(){
 document.getElementById("allCount").textContent=repairs.length;
 document.getElementById("waitCount").textContent=repairs.filter(x=>x.status==="รอรับเรื่อง").length;
 document.getElementById("doingCount").textContent=repairs.filter(x=>x.status==="กำลังซ่อม").length;
 document.getElementById("doneCount").textContent=repairs.filter(x=>x.status==="ซ่อมเสร็จ").length;
 let el=document.getElementById("adminList");if(!repairs.length){el.innerHTML='<div class="empty">ยังไม่มีรายการแจ้งซ่อม</div>';return;}
 el.innerHTML=`<table><thead><tr><th>หอ/โซน/ห้อง</th><th>ปัญหา</th><th>รายละเอียด/รูป</th><th>ผู้แจ้ง/เวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${repairs.map(x=>`<tr><td><b>${x.dorm}</b><br>โซน ${x.zone}<br>ห้อง ${x.room}</td><td>${x.type}</td><td>${x.detail}${x.photo?`<br><img src="${x.photo}" style="margin-top:7px;max-width:160px;max-height:110px;border-radius:8px" alt="รูปปัญหา">`:""}</td><td>${x.name}<br><span class="small">${x.date}</span></td><td>${badge(x.status)}</td><td><select onchange="changeStatus(${x.id},this.value)"><option ${x.status==="รอรับเรื่อง"?"selected":""}>รอรับเรื่อง</option><option ${x.status==="กำลังซ่อม"?"selected":""}>กำลังซ่อม</option><option ${x.status==="ซ่อมเสร็จ"?"selected":""}>ซ่อมเสร็จ</option></select><button class="btn danger" style="margin-top:6px;padding:7px 10px" onclick="removeItem(${x.id})">ลบ</button></td></tr>`).join("")}</tbody></table>`;
}
function updateQr(){
 const url=new URL("DormFix_แจ้งซ่อม.html",location.href).href;
 document.getElementById("qrUrl").value=url;
 document.getElementById("qrImage").src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(url);
}
function copyQrUrl(){navigator.clipboard.writeText(document.getElementById("qrUrl").value).then(()=>alert("คัดลอกลิงก์แล้ว")).catch(()=>alert("คัดลอกไม่สำเร็จ กรุณาคัดลอกลิงก์เอง"));}
render();updateQr();setInterval(render,2000);
</script></body></html>
