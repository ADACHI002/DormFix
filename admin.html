<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผู้ดูแลหอพัก - DormFix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,sans-serif;color:#111}
.card{max-width:850px;margin:25px auto;background:#fff;border-radius:24px;padding:25px;box-shadow:0 5px 25px #0001}
input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:12px;font-size:17px}
button{padding:13px 18px;border:0;border-radius:12px;background:#1976d2;color:#fff;font-size:17px;margin-top:10px;cursor:pointer}
.item{border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}.photo{display:block;max-width:100%;max-height:450px;margin-top:14px;border-radius:12px}
.danger{background:#d32f2f;margin-left:8px}.err{color:#c62828}.ok{color:green}.hidden{display:none}
</style></head><body>
<div class="card" id="login">
<h1>🔐 ผู้ดูแลหอพัก</h1>
<form id="lf"><input id="email" type="email" placeholder="อีเมล" required>
<input id="pw" type="password" placeholder="รหัสผ่าน" required>
<button type="submit">เข้าสู่ระบบ</button></form><p id="lm"></p>
</div>
<div class="card hidden" id="dash">
<h1>📋 รายการแจ้งซ่อม</h1><button id="logout">ออกจากระบบ</button>
<p id="status"></p><div id="list"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,onSnapshot,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCjW7zpUqWAY9oQyTnydS3P19g-KOvt-Ic",
  authDomain: "dormfix-24fe0.firebaseapp.com",
  projectId: "dormfix-24fe0",
  storageBucket: "dormfix-24fe0.firebasestorage.app",
  messagingSenderId: "1048588260040",
  appId: "1:1048588260040:web:cf5dddf21c1cd81bfecbfd",
  measurementId: "G-XCMMLSN04V"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
document.getElementById("lf").addEventListener("submit",async e=>{
 e.preventDefault();
 try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("pw").value)}
 catch(x){document.getElementById("lm").className="err";document.getElementById("lm").textContent="เข้าสู่ระบบไม่สำเร็จ: "+x.message}
});
document.getElementById("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 if(!u){login.classList.remove("hidden");dash.classList.add("hidden");return}
 login.classList.add("hidden");dash.classList.remove("hidden");
 onSnapshot(collection(db,"repairs"),snap=>{
  const a=[];snap.forEach(x=>a.push({id:x.id,...x.data()}));a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  list.innerHTML="";
  if(!a.length){list.innerHTML="<p>ยังไม่มีรายการ</p>";return}
  a.forEach(d=>{
   const item=document.createElement("div");item.className="item";
   const problem=d.problem||d.description||"-",reporter=d.reporter||d.reporterName||"-";
   item.innerHTML="<h2>🔧 รายการแจ้งซ่อม</h2><b>โซนหอพัก:</b> "+esc(d.zone||"-")+
    "<br><b>หอพัก:</b> "+esc(d.dorm||"-")+"<br><b>ห้อง:</b> "+esc(d.room||"-")+
    "<br><br><b>ปัญหาที่แจ้ง / รายละเอียด:</b><br>"+esc(problem)+
    "<br><br><b>ชื่อผู้แจ้ง:</b> "+esc(reporter)+"<br><br><b>สถานะ:</b> ";
   const sel=document.createElement("select");
   ["รอดำเนินการ","กำลังดำเนินการ","เสร็จแล้ว"].forEach(s=>{
    const o=document.createElement("option");o.value=s;o.textContent=s;o.selected=(d.status||"รอดำเนินการ")===s;sel.appendChild(o);
   });
   sel.onchange=async()=>{try{await updateDoc(doc(db,"repairs",d.id),{status:sel.value})}catch(x){alert("เปลี่ยนสถานะไม่ได้: "+x.message)}};
   item.appendChild(sel);
   if(d.photoData){const im=document.createElement("img");im.className="photo";im.src=d.photoData;item.appendChild(im)}
   const del=document.createElement("button");del.textContent="ลบ";del.className="danger";
   del.onclick=async()=>{if(confirm("ต้องการลบรายการนี้หรือไม่?"))try{await deleteDoc(doc(db,"repairs",d.id))}catch(x){alert("ลบไม่ได้: "+x.message)}};
   item.appendChild(del);list.appendChild(item);
  });
 },e=>{status.className="err";status.textContent="อ่านรายการไม่ได้: "+e.message});
});
</script></body></html>
