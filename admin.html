<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้ดูแลหอพัก - DormFix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111}
.card{max-width:760px;margin:45px auto;background:#fff;border-radius:24px;padding:30px;box-shadow:0 8px 30px #00000012}
h1{font-size:38px;margin:0 0 28px}
input{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #ccc;border-radius:14px;font-size:18px}
button{border:0;border-radius:14px;padding:15px 22px;font-size:18px;cursor:pointer;background:#1976d2;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:14px;min-height:28px;white-space:pre-wrap}
.hidden{display:none}
.item{border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}
.small{color:#666;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.danger{background:#d32f2f}
.ok{color:#087f23}
.err{color:#c62828}
</style>
</head>
<body>
<div class="card" id="loginPanel">
  <h1>🔐 ผู้ดูแลหอพัก</h1>
  <form id="loginForm" novalidate>
    <input id="email" type="email" autocomplete="username" placeholder="อีเมล" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
    <button id="loginBtn" type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="loginMsg" class="msg"></div>
</div>

<div class="card hidden" id="dashboard">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
    <h1 style="margin-bottom:0">📋 รายการแจ้งซ่อม</h1>
    <button id="logoutBtn">ออกจากระบบ</button>
  </div>
  <div id="status" class="msg"></div>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjW7zpUqWAY9oQyTnydS3P19g-KOvt-Ic",
  authDomain: "dormfix-24fe0.firebaseapp.com",
  projectId: "dormfix-24fe0",
  storageBucket: "dormfix-24fe0.firebasestorage.app",
  messagingSenderId: "1048588260040",
  appId: "1:1048588260040:web:cf5dddf21c1cd81bfecbfd",
  measurementId: "G-XCMMLSN04V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginMsg = document.getElementById("loginMsg");
const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const logoutBtn = document.getElementById("logoutBtn");
const status = document.getElementById("status");
const list = document.getElementById("list");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginMsg.className = "msg err";
    loginMsg.textContent = "กรุณากรอกอีเมลและรหัสผ่าน";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "กำลังเข้าสู่ระบบ...";
  loginMsg.className = "msg";
  loginMsg.textContent = "";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    loginMsg.className = "msg ok";
    loginMsg.textContent = "เข้าสู่ระบบสำเร็จ";
  } catch (error) {
    console.error(error);
    const code = error?.code || "";
    let message = error?.message || "เกิดข้อผิดพลาด";
    if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) {
      message = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
    } else if (code.includes("too-many-requests")) {
      message = "ลองเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่";
    } else if (code.includes("operation-not-allowed")) {
      message = "Firebase ยังไม่ได้เปิดการเข้าสู่ระบบแบบ Email/Password";
    }
    loginMsg.className = "msg err";
    loginMsg.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "เข้าสู่ระบบ";
  }
});

logoutBtn.addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (!user) {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  status.className = "msg ok";
  status.textContent = "เข้าสู่ระบบด้วย " + (user.email || "บัญชี Firebase");

  const q = query(collection(db, "repairs"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    list.innerHTML = "";
    if (snapshot.empty) {
      list.innerHTML = "<p>ยังไม่มีรายการแจ้งซ่อม</p>";
      return;
    }

    snapshot.forEach((snap) => {
      const data = snap.data();
      const item = document.createElement("div");
      item.className = "item";

      const created = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString("th-TH") : "-";
      item.innerHTML = `
        <b>หอพัก:</b> ${escapeHtml(data.dorm || "-")}<br>
        <b>ห้อง:</b> ${escapeHtml(data.room || "-")}<br>
        <b>ปัญหา:</b> ${escapeHtml(data.problem || "-")}<br>
        <b>ผู้แจ้ง:</b> ${escapeHtml(data.reporter || "-")}<br>
        <b>เวลา:</b> ${escapeHtml(created)}<br>
        <b>สถานะ:</b> ${escapeHtml(data.status || "รอดำเนินการ")}
      `;

      if (data.photoUrl) {
        const a = document.createElement("a");
        a.href = data.photoUrl;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "📷 ดูรูปแจ้งซ่อม";
        a.style.display = "inline-block";
        a.style.marginTop = "10px";
        item.appendChild(a);
      }

      const row = document.createElement("div");
      row.className = "row";

      const done = document.createElement("button");
      done.textContent = "ทำเสร็จแล้ว";
      done.addEventListener("click", async () => {
        try {
          await updateDoc(doc(db, "repairs", snap.id), {status:"ดำเนินการแล้ว"});
        } catch (e) {
          alert("อัปเดตไม่ได้: " + (e.message || e));
        }
      });

      const del = document.createElement("button");
      del.textContent = "ลบ";
      del.className = "danger";
      del.addEventListener("click", async () => {
        if (!confirm("ต้องการลบรายการนี้หรือไม่?")) return;
        try {
          await deleteDoc(doc(db, "repairs", snap.id));
        } catch (e) {
          alert("ลบไม่ได้: " + (e.message || e));
        }
      });

      row.append(done, del);
      item.appendChild(row);
      list.appendChild(item);
    }, (error) => {
      console.error(error);
      status.className = "msg err";
      status.textContent = "อ่านรายการไม่ได้: " + (error.message || error);
    });
  }, (error) => {
    console.error(error);
    status.className = "msg err";
    status.textContent = "อ่านรายการไม่ได้: " + (error.message || error);
  });
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}
</script>
</body>
</html>
